#name: Diagnostic - environment
  run: |
    echo "Runner: $RUNNER_OS"
    uname -a
    python --version || true
    pip --version || true
    echo "Installed packages (first 120 lines):"
    python -m pip list --format=columns | sed -n '1,120p' || true
    echo "Secrets presence (masked):"
    if [ -z "${{ secrets.DATABASE_URL }}" ]; then echo "DATABASE_URL: MISSING"; else echo "DATABASE_URL: PRESENT"; fi
    if [ -z "${{ secrets.SECRET_KEY }}" ]; then echo "SECRET_KEY: MISSING"; else echo "SECRET_KEY: PRESENT"; fi

- name: Install system-level build deps (required for Pillow and other binary packages)
  run: |
    sudo apt-get update
    sudo apt-get install -y libjpeg-dev zlib1g-dev libtiff5-dev libopenjp2-7-dev build-essential

- name: Setup Python
  uses: actions/setup-python@v4
  with:
    python-version: '3.11'

- name: Install Python deps
  run: |
    python -m pip install --upgrade pip setuptools wheel
    if [ -f requirements.txt ]; then pip install -r requirements.txt || pip install -r requirements.txt --use-deprecated=legacy-resolver; else echo "requirements.txt not found"; fi

- name: Wait for Postgres
  run: |
    for i in {1..30}; do pg_isready -h localhost -p 5432 && break || sleep 1; done

- name: Run migrations and tests
  env:
    # Use the service Postgres; override if you use a different DB URL in secrets
    DATABASE_URL: postgresql://test:password@localhost:5432/test_db
    SECRET_KEY: ${{ secrets.SECRET_KEY }}
  run: |
    mkdir -p test-logs
    echo "Running migrations..."
    python manage.py migrate --noinput 2>&1 | tee test-logs/migrate.log || true
    echo "Running tests..."
    python manage.py test --verbosity=2 2>&1 | tee test-logs/tests.log
    echo $? > test-logs/exitcode || true

- name: Upload test logs
  uses: actions/upload-artifact@v4
  with:
    name: django-test-logs
    path: test-logs/**
